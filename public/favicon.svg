<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%">
      <stop offset="0%" stop-color="#2a1a0a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#f0c000"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5"/>

  <!-- Chessboard — 4×4 grid centered at (32, 32) -->
  <g transform="translate(16, 16)">
    <rect x="0"  y="0"  width="16" height="16" fill="#d4a017" rx="1.5"/>
    <rect x="16" y="0"  width="16" height="16" fill="#1a1005" rx="1.5"/>
    <rect x="0"  y="16" width="16" height="16" fill="#1a1005" rx="1.5"/>
    <rect x="16" y="16" width="16" height="16" fill="#d4a017" rx="1.5"/>
  </g>

  <!-- Bow centered below chessboard -->
  <path d="M18 48 Q32 38 46 48" fill="none" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bowstring -->
  <line x1="18" y1="48" x2="46" y2="48" stroke="#ffd700" stroke-width="0.8" opacity="0.6"/>

  <!-- Arrow pointing up-left (into the board) -->
  <line x1="22" y1="46" x2="32" y2="32" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="32,32 29,36 30,31" fill="#ffd700"/>
  <!-- Fletching -->
  <line x1="22" y1="46" x2="19" y2="48" stroke="#fff" stroke-width="1" opacity="0.7"/>
  <line x1="22" y1="46" x2="20" y2="49" stroke="#fff" stroke-width="1" opacity="0.7"/>
</svg>
