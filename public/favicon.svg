<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%">
      <stop offset="0%" stop-color="#2a1a0a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#f0c000"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="url(#gold)" stroke-width="2"/>
  <!-- Chessboard -->
  <rect x="18" y="20" width="12" height="12" fill="#d4a017" rx="1"/>
  <rect x="30" y="20" width="12" height="12" fill="#2a1a0a" rx="1"/>
  <rect x="18" y="32" width="12" height="12" fill="#2a1a0a" rx="1"/>
  <rect x="30" y="32" width="12" height="12" fill="#d4a017" rx="1"/>
  <!-- Bow -->
  <path d="M22 44 Q32 36 42 44" fill="none" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
  <!-- Arrow -->
  <line x1="28" y1="42" x2="36" y2="34" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="36,34 34,37 35,33" fill="#ffd700"/>
</svg>
